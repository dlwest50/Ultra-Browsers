<html lang="en">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 8px 12px;
      background: #2c3e50;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header input {
      flex: 1;
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      font-size: 14px;
    }

    #content {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #sidebar {
      width: 300px;
      max-width: 80%;
      overflow-y: auto;
      border-right: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
      background: #f8f8f8;
    }

    #map {
      flex: 1;
    }

    h3 {
      margin: 10px 0 5px;
      font-size: 16px;
    }

    .market-item {
      padding: 6px;
      margin-bottom: 4px;
      border-radius: 4px;
      cursor: pointer;
    }

    .market-item:hover {
      background: #e0e0e0;
    }

    .market-item input {
      margin-right: 6px;
    }

    .distance-box {
      margin-top: 10px;
      padding: 8px;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      #content {
        flex-direction: column;
      }
      #sidebar {
        width: 100%;
        max-height: 40%;
        border-right: none;
        border-bottom: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>

      <div class="distance-box" id="distanceBox">
        Select two flea markets to calculate distance.
      </div>
    </div>

    <div id="map"></div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  const oklahomaMarkets = [

    {"Name":"Market Directory OK","City":"Various","GPS":[35.4676,-97.5164],"Schedule":"Varies","URL":"https://oklac.org/market-directory"},

    {"Name":"Pryor Trader’s Day","City":"Pryor","GPS":[36.3081,-95.3164],"Schedule":"1st Saturday","URL":"https://pryorchamber.com"},
    {"Name":"Lee’s Corner Market","City":"Muskogee","GPS":[35.7511,-95.3712],"Schedule":"Daily","URL":"http://leescornerok.com"},
    {"Name":"Wagon Wheel Merc.","City":"OKC","GPS":[35.4771,-97.6184],"Schedule":"Daily","URL":"https://www.facebook.com/WagonWheel"},
    {"Name":"Rose District Market","City":"Broken Arrow","GPS":[36.0514,-95.7912],"Schedule":"Every Saturday","URL":"https://www.rosedistrict.com"},
    {"Name":"Stillwater Flea Market","City":"Stillwater","GPS":[36.1156,-97.0584],"Schedule":"Every Sunday","URL":"https://stillwaterchamber.org"},
    {"Name":"Enid Flea Market","City":"Enid","GPS":[36.3956,-97.8784],"Schedule":"3rd Weekend","URL":"https://www.enidbuzz.com"},
    {"Name":"Cushing Swap Meet","City":"Cushing","GPS":[35.9841,-96.7674],"Schedule":"2nd Saturday","URL":"https://cushingchamber.org"},
    {"Name":"Norman Flea Market","City":"Norman","GPS":[35.2226,-97.4395],"Schedule":"Every Sat/Sun","URL":"https://www.visitnorman.com"},
    {"Name":"Guthrie Antique Market","City":"Guthrie","GPS":[35.8773,-97.4251],"Schedule":"Daily","URL":"https://www.guthrieok.com"}
  ];

  // =====================
  // Map setup
  // =====================
  const map = L.map('map').setView([33.5, -99], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const allMarkers = [];
  let selectedMarkets = [];
  let distanceLine = null;

  function haversine(latlng1, latlng2) {
    const R = 3958.8; // miles
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(latlng2.lat - latlng1.lat);
    const dLon = toRad(latlng2.lng - latlng1.lng);
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(latlng1.lat)) *
      Math.cos(toRad(latlng2.lat)) *
      Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function updateDistance() {
    const box = document.getElementById('distanceBox');
    if (distanceLine) {
      map.removeLayer(distanceLine);
      distanceLine = null;
    }
    if (selectedMarkets.length === 2) {
      const p1 = selectedMarkets[0].marker.getLatLng();
      const p2 = selectedMarkets[1].marker.getLatLng();
      const dist = haversine(p1, p2).toFixed(1);
      box.textContent = `Distance: ${dist} miles`;
      distanceLine = L.polyline([p1, p2]).addTo(map);
      map.fitBounds(distanceLine.getBounds(), { padding: [40, 40] });
    } else {
      box.textContent = 'Select two flea markets to calculate distance.';
    }
  }

  function addMarkets(markets, containerId) {
    const container = document.getElementById(containerId);

    markets.forEach(market => {
      const marker = L.marker(market.GPS).addTo(map);
      marker.bindPopup(`<strong>${market.Name}</strong><br>${market.City}<br>${market.Schedule}`);

      marker.on('click', () => {
        window.open(market.URL, '_blank');
      });

      allMarkers.push({ ...market, marker });

      const div = document.createElement('div');
      div.className = 'market-item';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';

      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          if (selectedMarkets.length >= 2) {
            checkbox.checked = false;
            return;
          }
          selectedMarkets.push({ ...market, marker });
        } else {
          selectedMarkets = selectedMarkets.filter(m => m.marker !== marker);
        }
        updateDistance();
      });

      div.appendChild(checkbox);
      div.appendChild(document.createTextNode(`${market.Name} (${market.City})`));

      div.addEventListener('click', (e) => {
        if (e.target !== checkbox) {
          map.setView(market.GPS, 10);
          marker.openPopup();
        }
      });

      container.appendChild(div);
    });
  }

  addMarkets(texasMarkets, 'list-texas');
  addMarkets(oklahomaMarkets, 'list-oklahoma');

  // =====================
  // Search
  // =====================
  document.getElementById('searchInput').addEventListener('input', function () {
    const q = this.value.toLowerCase();
    allMarkers.forEach(m => {
      const match = m.Name.toLowerCase().includes(q) || m.City.toLowerCase().includes(q);
      if (match) {
        m.marker.setOpacity(1);
      } else {
        m.marker.setOpacity(0.2);
      }
    });

    const matches = allMarkers.filter(m =>
      m.Name.toLowerCase().includes(q) || m.City.toLowerCase().includes(q)
    );

    if (matches.length === 1) {
      map.setView(matches[0].GPS, 10);
    }
  });
</script>
</body>
</html>
