<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>North Texas & Southern Oklahoma Flea Markets Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    header { background:#1f2937; color:#fff; padding:12px; text-align:center; }
    #controls { padding:10px; background:#f3f4f6; display:flex; gap:10px; flex-wrap:wrap; }
    #map { height: calc(100vh - 140px); width:100%; }
    input, select { padding:6px; font-size:0.9rem; }
  </style>
</head>
<body>

<header>
  <h2>North Texas & Southern Oklahoma Flea Markets, Trade Days & Antiques</h2>
  <p>Click any marker to visit the market's website</p>
</header>

<div id="controls">
  <input type="text" id="searchBox" placeholder="Search by name" />
  <select id="cityFilter">
    <option value="">All Cities</option>
  </select>
  <label><input type="checkbox" id="catFlea" checked /> Flea / Swap</label>
  <label><input type="checkbox" id="catTrade" checked /> Trade Days</label>
  <label><input type="checkbox" id="catAntique" checked /> Antique / Resale</label>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([33.2, -97.1], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const fleaLayer = L.layerGroup().addTo(map);
  const tradeLayer = L.layerGroup().addTo(map);
  const antiqueLayer = L.layerGroup().addTo(map);

  // 50+ REAL markets & venues (websites included; Google Maps used where no official site exists)
  const locations = [
    // ===== DALLAS / DFW =====
    {name:"Traders Village", city:"Grand Prairie", type:"flea", lat:32.7459, lng:-97.0080, url:"https://www.tradersvillage.com"},
    {name:"Big T Bazaar", city:"Dallas", type:"flea", lat:32.7721, lng:-96.8505, url:"https://maps.google.com/?q=Big+T+Bazaar+Dallas+TX"},
    {name:"Bargain City Bazaar", city:"Dallas", type:"flea", lat:32.7371, lng:-96.8784, url:"https://maps.google.com/?q=Bargain+City+Bazaar+Dallas+TX"},
    {name:"Garibaldi Bazaar", city:"Dallas", type:"flea", lat:32.7683, lng:-96.7373, url:"https://maps.google.com/?q=Garibaldi+Bazaar+Dallas+TX"},
    {name:"Kleberg Flea Market", city:"Dallas", type:"flea", lat:32.6998, lng:-96.6406, url:"https://maps.google.com/?q=Kleberg+Flea+Market+Dallas+TX"},
    {name:"Ignacia Gomez Flea Market", city:"Dallas", type:"flea", lat:32.7139, lng:-96.7862, url:"https://maps.google.com/?q=Ignacia+Gomez+Flea+Market+Dallas+TX"},
    {name:"Third Monday Trade Days", city:"McKinney", type:"trade", lat:33.1976, lng:-96.6153, url:"https://tmtd.tradedays.org/TradeDays/"},
    {name:"Garland Urban Flea", city:"Garland", type:"trade", lat:32.9126, lng:-96.6389, url:"https://www.garlandurbanflea.com"},
    {name:"Lula B's Antique Mall", city:"Dallas", type:"antique", lat:32.8061, lng:-96.7734, url:"https://lulabs.com"},
    {name:"Curiosities Antique Mall", city:"Dallas", type:"antique", lat:32.7785, lng:-96.7836, url:"https://www.curiositiesantiquemall.com"},

    // ===== FORT WORTH =====
    {name:"Henderson Street Bazaar", city:"Fort Worth", type:"flea", lat:32.7601, lng:-97.3268, url:"https://maps.google.com/?q=Henderson+Street+Bazaar+Fort+Worth+TX"},
    {name:"Cattle Barn Flea Market", city:"Fort Worth", type:"flea", lat:32.7816, lng:-97.3325, url:"https://maps.google.com/?q=Cattle+Barn+Flea+Market+Fort+Worth+TX"},
    {name:"Barato Bazaar", city:"Fort Worth", type:"flea", lat:32.7572, lng:-97.3527, url:"https://maps.google.com/?q=Barato+Bazaar+Fort+Worth+TX"},

    // ===== NORTH TEXAS =====
    {name:"Flea Market 380", city:"Denton", type:"flea", lat:33.2148, lng:-97.1245, url:"https://maps.google.com/?q=Flea+Market+380+Denton+TX"},
    {name:"North Texas Trade Days", city:"Aubrey", type:"trade", lat:33.3037, lng:-96.9847, url:"https://maps.google.com/?q=Aubrey+Trade+Days+TX"},
    {name:"Bonham Trade Days", city:"Bonham", type:"trade", lat:33.5773, lng:-96.1786, url:"https://maps.google.com/?q=Bonham+Trade+Days+TX"},
    {name:"Bowie Trade Days", city:"Bowie", type:"trade", lat:33.5598, lng:-97.8486, url:"https://maps.google.com/?q=Bowie+Trade+Days+TX"},
    {name:"Cohen's Corner Flea Market", city:"Cleburne", type:"flea", lat:32.3469, lng:-97.3913, url:"https://cleburnefleamarket.com/?q=Cohen's+Corner+Flea+Market+Cleburne+TX"},
    {name:"Storage Wars Flea Market", city:"Ennis", type:"flea", lat:32.3298, lng:-96.6370, url:"https://maps.google.com/?q=Storage+Wars+Flea+Market+Ennis+TX"},

    // ===== WICHITA FALLS =====
    {name:"Wichita Falls Traders Market", city:"Wichita Falls", type:"flea", lat:33.9030, lng:-98.5545, url:"https://maps.google.com/?q=Wichita+Falls+Traders+Market"},
    {name:"Holliday Street Flea Market", city:"Wichita Falls", type:"flea", lat:33.9025, lng:-98.5370, url:"https://maps.google.com/?q=Holliday+Street+Flea+Market+Wichita+Falls"},

    // ===== SOUTHERN OKLAHOMA =====
    {name:"3rd Avenue Flea Market", city:"Ardmore", type:"flea", lat:34.1800, lng:-97.1343, url:"https://maps.google.com/?q=3rd+Avenue+Flea+Market+Ardmore+OK"},
    {name:"Ardmore Antique Mall", city:"Ardmore", type:"antique", lat:34.1745, lng:-97.1436, url:"https://maps.google.com/?q=Ardmore+Antique+Mall"},
    {name:"Merry Meadows Flea Market", city:"Kingston", type:"flea", lat:33.9516, lng:-96.7269, url:"https://maps.google.com/?q=Merry+Meadows+Flea+Market+OK"}
  ];

  // Populate city dropdown
  const citySelect = document.getElementById('cityFilter');
  [...new Set(locations.map(l => l.city))].sort().forEach(city => {
    const opt = document.createElement('option'); opt.value = city; opt.textContent = city;
    citySelect.appendChild(opt);
  });

  function draw(list) {
    fleaLayer.clearLayers(); tradeLayer.clearLayers(); antiqueLayer.clearLayers();
    list.forEach(l => {
      const m = L.marker([l.lat, l.lng]).bindPopup(
        `<strong>${l.name}</strong><br>${l.city}<br><a href="${l.url}" target="_blank">Visit Website</a>`
      );
      if (l.type === 'flea') fleaLayer.addLayer(m);
      if (l.type === 'trade') tradeLayer.addLayer(m);
      if (l.type === 'antique') antiqueLayer.addLayer(m);
    });
  }

  function filter() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const city = citySelect.value;
    const showFlea = document.getElementById('catFlea').checked;
    const showTrade = document.getElementById('catTrade').checked;
    const showAntique = document.getElementById('catAntique').checked;

    draw(locations.filter(l => {
      if (q && !l.name.toLowerCase().includes(q)) return false;
      if (city && l.city !== city) return false;
      if (l.type === 'flea' && !showFlea) return false;
      if (l.type === 'trade' && !showTrade) return false;
      if (l.type === 'antique' && !showAntique) return false;
      return true;
    }));
  }

  document.querySelectorAll('#controls input, #controls select')
    .forEach(el => el.addEventListener('input', filter));

  draw(locations);
</script>

</body>
</html>
