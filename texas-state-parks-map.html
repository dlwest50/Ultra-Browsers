<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas State Parks Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #container { display: flex; height: 100vh; flex-direction: column; }
        #header { padding: 10px; background: #f0f0f0; text-align: center; }
        #sidebar { width: 100%; padding: 10px; overflow-y: auto; background: #fff; border-bottom: 1px solid #ccc; max-height: 40vh; }
        #map { flex: 1; }
        #search { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        #park-list { list-style: none; padding: 0; margin: 0; }
        #park-list li { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; }
        #park-list li:hover { background: #f5f5f5; }

        /* Custom tooltip styling */
        .custom-tooltip {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            white-space: nowrap;
            max-width: 300px;
        }

        @media (min-width: 768px) {
            #container { flex-direction: row; }
            #sidebar { width: 320px; max-height: none; border-bottom: none; border-right: 1px solid #ccc; }
            #map { height: 100%; }
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>Interactive Map of Texas State Parks</h1>
    </div>
    <div id="container">
        <div id="sidebar">
            <h2>Texas State Parks (≈89)</h2>
            <p>Hover over markers for quick info, click a park name to zoom in, or click a marker to visit the official TPWD site (trails, camping, reservations, etc.).</p>
            <input id="search" type="text" placeholder="Search parks...">
            <ul id="park-list"></ul>
        </div>
        <div id="map"></div>
    </div>

            { name: "Village Creek State Park", lat: 30.2500, lng: -94.1833, url: "https://tpwd.texas.gov/state-parks/village-creek", desc: "Pineywoods, canoeing, fishing, hiking" },
            { name: "Wyler Aerial Tramway State Park", lat: 31.8000, lng: -106.4833, url: "https://tpwd.texas.gov/state-parks/wyler-aerial-tramway", desc: "Aerial tram rides, panoramic El Paso views" }
        ];

        parks.sort((a, b) => a.name.localeCompare(b.name));

        const list = document.getElementById('park-list');
        const markers = [];

        parks.forEach((park, index) => {
            const li = document.createElement('li');
            li.textContent = park.name;
            li.addEventListener('click', () => {
                map.setView([park.lat, park.lng], 13);
                markers[index].openPopup();
            });
            list.appendChild(li);

            const marker = L.marker([park.lat, park.lng]).addTo(map);

            let tooltipContent = `<b>${park.name}</b>`;
            if (park.desc) tooltipContent += `<br>${park.desc}`;
            marker.bindTooltip(tooltipContent, {
                permanent: false,
                direction: 'top',
                offset: [0, -12],
                opacity: 1,
                className: 'custom-tooltip'
            });

            marker.bindPopup(`<b>${park.name}</b><br>${park.desc || ''}<br><br><a href="${park.url}" target="_blank">Official TPWD Site →</a>`);

            marker.on('click', () => {
                window.open(park.url, '_blank');
            });

            markers.push(marker);
        });

        document.getElementById('search').addEventListener('input', e => {
            const term = e.target.value.toLowerCase();
            list.querySelectorAll('li').forEach((li, i) => {
                li.style.display = parks[i].name.toLowerCase().includes(term) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
