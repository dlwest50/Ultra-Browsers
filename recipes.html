        function renderRecipes(filtered) {
            const list = document.getElementById('list');
            list.innerHTML = '';
            filtered.forEach(recipe => {
                const div = document.createElement('div');
                div.className = 'recipe';
                div.innerHTML = `<h3>${recipe.name} (${recipe.category})</h3>
                                 <div class="details">
                                     <h4>Ingredients:</h4><ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                                     <h4>Steps:</h4><ol>${recipe.steps.map(s => `<li>${s}</li>`).join('')}</ol>
                                 </div>`;
                div.addEventListener('click', () => {
                    const details = div.querySelector('.details');
                    details.classList.toggle('show');
                });
                list.appendChild(div);
            });
        }

        function filterRecipes() {
            const search = document.getElementById('search').value.toLowerCase();
            const category = document.getElementById('sort').value;
            let filtered = recipes;
            if (search) {
                filtered = filtered.filter(r => r.name.toLowerCase().includes(search));
            }
            if (category) {
                filtered = filtered.filter(r => r.category === category);
            }
            renderRecipes(filtered);
        }

        document.getElementById('search').addEventListener('input', filterRecipes);
        document.getElementById('sort').addEventListener('change', filterRecipes);
