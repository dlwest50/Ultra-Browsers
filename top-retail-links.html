    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        h1 { text-align: center; margin-bottom: 5px; color: #0f172a; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-box:focus { border-color: var(--primary); ring: 2px solid #bfdbfe; }

        .btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover { background: #1d4ed8; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #f1f5f9;
            text-align: left;
            padding: 12px;
            cursor: pointer;
            user-select: none;
            border-bottom: 2px solid var(--border);
        }

        th:hover { background: #e2e8f0; }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        tr:hover { background-color: #f8fafc; }

        .url-link { color: var(--primary); text-decoration: none; font-weight: 500; }
        .url-link:hover { text-decoration: underline; }

        .category-tag {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .hide-mobile { display: none; }
            .container { padding: 15px; }
        }
    </style>
</head>

    let currentSort = 'rank';
    let isAlpha = false;

    function renderTable(data) {
        const body = document.getElementById('tableBody');
        body.innerHTML = '';
        data.forEach(item => {
            const row = `<tr>
                <td>${item.rank}</td>
                <td><strong>${item.name}</strong></td>
                <td><span class="category-tag">${item.cat}</span></td>
                <td class="hide-mobile"><a href="https://${item.url}" class="url-link" target="_blank">${item.url}</a></td>
            </tr>`;
            body.innerHTML += row;
        });
    }

    // Search function
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = retailers.filter(r => 
            r.name.toLowerCase().includes(term) || 
            r.cat.toLowerCase().includes(term)
        );
        renderTable(filtered);
    });

    // Toggle logic
    function toggleView() {
        isAlpha = !isAlpha;
        const sorted = [...retailers].sort((a, b) => {
            return isAlpha ? a.name.localeCompare(b.name) : a.rank - b.rank;
        });
        renderTable(sorted);
    }

    // Sort by column
    function sortTable(n) {
        let sorted;
        if (n === 0) sorted = [...retailers].sort((a, b) => a.rank - b.rank);
        if (n === 1) sorted = [...retailers].sort((a, b) => a.name.localeCompare(b.name));
        if (n === 2) sorted = [...retailers].sort((a, b) => a.cat.localeCompare(b.cat));
        renderTable(sorted);
    }

    // Initial render
    renderTable(retailers);
