<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Top 50 Texas BBQ Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100%; }

        /* Header Styling */
        .map-header {
            position: absolute; top: 10px; left: 10px;
            z-index: 1000; background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-left: 5px solid #d35400;
        }
        h1 { margin: 0; font-size: 1.2rem; color: #333; }
        
        /* Search Bar Styling */
        .search-container {
            position: absolute; top: 10px; right: 10px;
            z-index: 1000; background: white;
            padding: 10px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex; gap: 5px;
        }
        #searchInput {
            padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 200px;
        }
        #searchBtn {
            padding: 8px 12px; background: #d35400; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        /* Numbered Teardrop Style */
        .teardrop-wrapper { position: relative; }
        .teardrop {
            width: 34px; height: 34px; border-radius: 50% 50% 50% 0;
            background: #e67e22; position: absolute; transform: rotate(-45deg);
            left: 50%; top: 50%; margin: -17px 0 0 -17px;
            border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.4);
        }
        .marker-number {
            position: absolute; width: 34px; text-align: center;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-weight: bold; font-size: 14px; z-index: 10;
        }

        .custom-popup { text-align: center; padding: 5px; }
        .bbq-btn {
            display: inline-block; margin-top: 8px; padding: 6px 10px;
            background-color: #d35400; color: white !important;
            text-decoration: none; border-radius: 4px; font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="map-header">
    <h1>Texas BBQ Top 50</h1>
    <div style="font-size: 0.8rem; color: #666;">Official 2025/2026 Rankings</div>
</div>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search by name or rank (e.g. 1)...">
    <button id="searchBtn">Find</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        { rank: 45, name: "Desert Oak Barbecue", city: "El Paso", coords: [31.7619, -106.4850], url: "https://www.desertoakbarbecue.com" },
        { rank: 46, name: "Smokey Joe's BBQ", city: "Dallas", coords: [32.7115, -96.8045], url: "https://www.smokeyjoesbbqdallas.com" },
        { rank: 47, name: "Zavala's Barbecue", city: "Grand Prairie", coords: [32.7445, -96.9945], url: "https://www.zavalasbbq.com" },
        { rank: 48, name: "Smoke Sessions BBQ", city: "Royse City", coords: [32.9755, -96.3325], url: "https://www.smokesessionsbarbecue.com" },
        { rank: 49, name: "Pustka Family Barbeque", city: "Temple", coords: [31.0982, -97.3432], url: "https://www.pustkafamilybbq.com" },
        { rank: 50, name: "Teddy's Barbecue", city: "Weslaco", coords: [26.1595, -97.9908], url: "https://www.teddysbarbecue.com" }
    ];

    const markerMap = {}; // To store markers for search access

    bbqSpots.forEach(spot => {
        // Create custom div icon with rank number
        const icon = L.divIcon({
            className: 'teardrop-wrapper',
            html: `<div class='teardrop'></div><div class='marker-number'>${spot.rank}</div>`,
            iconSize: [34, 46],
            iconAnchor: [17, 46],
            popupAnchor: [0, -42]
        });

        const marker = L.marker(spot.coords, { icon: icon }).addTo(map);
        
        const popupContent = `
            <div class="custom-popup">
                <strong>#${spot.rank}: ${spot.name}</strong><br>
                ${spot.city}, TX<br>
                <a href="${spot.url}" target="_blank" class="bbq-btn">Visit Website</a>
            </div>
        `;
        
        marker.bindPopup(popupContent);
        markerMap[spot.rank] = marker; // Store by rank
        markerMap[spot.name.toLowerCase()] = marker; // Store by name
    });

    // Search Functionality
    function performSearch() {
        const input = document.getElementById('searchInput').value.toLowerCase().trim();
        let targetMarker = null;

        // Find by rank or name
        if (markerMap[input]) {
            targetMarker = markerMap[input];
        } else {
            // Partial name match search
            for (let key in markerMap) {
                if (key.includes(input)) {
                    targetMarker = markerMap[key];
                    break;
                }
            }
        }

        if (targetMarker) {
            map.setView(targetMarker.getLatLng(), 12);
            targetMarker.openPopup();
        } else {
            alert("No BBQ joint found for: " + input);
        }
    }

    document.getElementById('searchBtn').addEventListener('click', performSearch);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });
</script>

</body>
</html>
