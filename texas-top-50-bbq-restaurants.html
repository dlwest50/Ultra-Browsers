<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas BBQ Trail: Top 50 of 2025/2026</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100%; }

        .map-header {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center; border-top: 5px solid #d35400; width: 320px;
        }

        h1 { margin: 0; font-size: 1.4rem; color: #333; }
        p { margin: 5px 0 0; font-size: 0.85rem; color: #d35400; font-weight: bold; }

        /* Teardrop Marker Style */
        .teardrop {
            width: 30px; height: 30px; border-radius: 50% 50% 50% 0;
            background: #e67e22; position: absolute; transform: rotate(-45deg);
            left: 50%; top: 50%; margin: -15px 0 0 -15px;
            border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.4);
        }
        .teardrop::after {
            content: ""; width: 8px; height: 8px; margin: 11px 0 0 11px;
            background: white; position: absolute; border-radius: 50%;
        }

        .custom-popup { text-align: center; }
        .bbq-btn {
            display: inline-block; margin-top: 10px; padding: 6px 10px;
            background-color: #d35400; color: white !important;
            text-decoration: none; border-radius: 4px; font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="map-header">
    <h1>The BBQ 50</h1>
    <p>Official 2025/2026 Texas Monthly Top Picks</p>
</div>

<div id="map"></div>

    const teardropIcon = L.divIcon({
        className: 'custom-div-icon',
        html: "<div class='teardrop'></div>",
        iconSize: [30, 42], iconAnchor: [15, 42], popupAnchor: [0, -40]
    });

    bbqSpots.forEach(spot => {
        L.marker(spot.coords, { icon: teardropIcon })
            .addTo(map)
            .bindPopup(`
                <div class="custom-popup">
                    <strong>${spot.name}</strong><br>
                    ${spot.city}, TX<br>
                    <a href="${spot.url}" target="_blank" class="bbq-btn">Visit Website</a>

            `);
    });
</script>

</body>
</html>
